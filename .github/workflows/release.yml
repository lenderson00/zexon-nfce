name: Release
# Publica quando a versão do package.json muda na main (ou por tag/disparo manual).
# Se a versão já estiver no npm, não faz nada.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write   # criar a tag no disparo manual
  id-token: write   # provenance do npm
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - name: Versão
        id: v
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Tag confere com o package.json
        if: github.ref_type == 'tag'
        run: test "${{ steps.v.outputs.tag }}" = "${GITHUB_REF_NAME}"
      - name: Versão já publicada?
        id: pub
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Versão já está no npm — nada a publicar."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pub.outputs.skip == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Criar a tag
        if: steps.pub.outputs.skip == 'false' && github.ref_type != 'tag'
        run: |
          git tag "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"
