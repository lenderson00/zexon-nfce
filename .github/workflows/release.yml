name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # publica a versão do package.json e cria a tag vX.Y.Z
permissions:
  contents: write   # criar a tag no disparo manual
  id-token: write   # provenance do npm
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - name: Versão
        id: v
        run: echo "tag=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Tag confere com o package.json
        if: github.ref_type == 'tag'
        run: test "${{ steps.v.outputs.tag }}" = "${GITHUB_REF_NAME}"
      - name: Versão ainda não publicada
        run: |
          if npm view "$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')" version 2>/dev/null; then
            echo "Esta versão já está no npm; rode npm version patch antes." && exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Criar a tag (disparo manual)
        if: github.ref_type != 'tag'
        run: |
          git tag "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"
